# ============================================
# Docker Compose for Billarde Application
# Single container with Frontend + Backend + SQLite Database
# ============================================

services:
  billarde:
    build:
      context: .
      dockerfile: Dockerfile
    image: billarde:latest
    container_name: billarde
    ports:
      - "${HOST_PORT:-80}:80"
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
    # Values come from the .env file next to this file (see .env.example)
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY manquant - copiez .env.example en .env}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

volumes:
  sqlite_data:
